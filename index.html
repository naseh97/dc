<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player Scratch Word Game</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* Top-Left Exit Button */
        .exit-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .exit-btn:hover { background: #dc2626; }

        h1 { margin-top: 15px; margin-bottom: 5px; color: #818cf8; }
        p { color: var(--muted); }

        input, select {
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            width: 80%;
            margin-bottom: 15px;
        }

        button.main-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.main-btn:hover { background-color: #4338ca; }

        .word-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .letter-box {
            font-size: 36px;
            font-weight: bold;
            width: 50px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #334155;
            border-radius: 8px;
            color: transparent; 
            transition: all 0.3s ease;
        }

        .letter-box.revealed {
            color: #f8fafc;
            background: #0f172a;
            border: 2px solid #475569;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .hidden { display: none; }
        
        .hint-box {
            margin-top: 15px;
            padding: 10px;
            background: #334155;
            border-radius: 6px;
            color: #facc15;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <!-- Global Exit Button -->
        <button id="exit-btn" class="exit-btn hidden" onclick="resetToHome()">🚪 Exit</button>

        <h1>Scratch Word Game</h1>
        <p>Two-player live guessing challenge</p>

        <!-- Phase 1: Game Setup -->
        <div id="setup-names-screen">
            <h3>Game Setup</h3>
            <label style="color: var(--muted); display: block; margin-bottom: 5px;">Number of Players:</label>
            <select id="num-players">
                <option value="2" selected>2 Players</option>
                <option value="3">3 Players (Coming Soon)</option>
            </select><br>
            
            <input type="text" id="p1-name" placeholder="Player 1 Name (Word Maker)"><br>
            <input type="text" id="p2-name" placeholder="Player 2 Name (Guesser)"><br>

            <label style="color: var(--muted); display: block; margin-bottom: 5px;">Total Tries for Guesser:</label>
            <select id="max-tries-select">
                <option value="5">5 Tries</option>
                <option value="7" selected>7 Tries</option>
                <option value="10">10 Tries</option>
            </select><br><br>

            <button class="main-btn" onclick="goToWordScreen()">Next: Enter Word</button>
        </div>

        <!-- Phase 2: Player 1 Enters Word -->
        <div id="setup-word-screen" class="hidden">
            <h3 id="p1-prompt">Player 1: Enter Secret Word</h3>
            <input type="password" id="secret-word-input" placeholder="e.g. hungry">
            <br>
            <button class="main-btn" onclick="startGame()">Start Game</button>
        </div>

        <!-- Phase 3: Player 2 Guesses -->
        <div id="game-screen" class="hidden">
            <h3 id="p2-prompt">Player 2: Guess a Letter</h3>
            
            <div class="stats">
                <div>❤️ Tries Left: <span id="tries-left" style="color: #ef4444; font-weight: bold;">7</span></div>
                <div>❌ Wrong: <span id="wrong-letters">None</span></div>
            </div>

            <div class="word-container" id="word-container"></div>

            <div id="guess-section">
                <input type="text" id="letter-input" maxlength="1" placeholder="Type a letter">
                <br>
                <button class="main-btn" onclick="makeGuess()">Submit Guess</button>
            </div>

            <div id="hint-section" class="hidden">
                <p style="color: #f8fafc; margin-top: 15px;">⚠️ Last try remaining!</p>
                <button class="main-btn" onclick="requestHint()" style="background: #eab308; color: black;">Ask <span class="p1-label">Player 1</span> for Hint</button>
                <div id="hint-display" class="hint-box hidden"></div>
            </div>
        </div>

        <!-- Phase 4: Game Over -->
        <div id="game-over-screen" class="hidden">
            <h2 id="game-result" style="font-size: 24px; margin-bottom: 10px;"></h2>
            <p id="word-reveal" style="font-size: 20px; color: #38bdf8; margin-bottom: 20px;"></p>
            <button class="main-btn" onclick="resetToHome()">Play Again</button>
        </div>
    </div>

    <script>
        let p1Name = "Player 1";
        let p2Name = "Player 2";
        let secretWord = "";
        let guessedLetters = [];
        let wrongGuesses = [];
        let maxTries = 7;

        function resetToHome() {
            secretWord = "";
            guessedLetters = [];
            wrongGuesses = [];
            
            document.getElementById("secret-word-input").value = "";
            document.getElementById("letter-input").value = "";
            document.getElementById("hint-display").classList.add("hidden");
            document.getElementById("hint-section").classList.add("hidden");

            document.getElementById("setup-names-screen").classList.remove("hidden");
            document.getElementById("setup-word-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("game-over-screen").classList.add("hidden");
            document.getElementById("exit-btn").classList.add("hidden");
        }

        function goToWordScreen() {
            const numPlayers = document.getElementById("num-players").value;
            if (numPlayers !== "2") {
                alert("Currently, this layout supports 2 players. More player slots coming soon!");
                return;
            }

            const name1 = document.getElementById("p1-name").value.trim();
            const name2 = document.getElementById("p2-name").value.trim();
            
            if (name1) p1Name = name1;
            if (name2) p2Name = name2;

            maxTries = parseInt(document.getElementById("max-tries-select").value);

            document.getElementById("p1-prompt").innerText = `${p1Name}: Enter Secret Word`;
            document.getElementById("p2-prompt").innerText = `${p2Name}: Guess a Letter`;
            document.querySelectorAll(".p1-label").forEach(el => el.innerText = p1Name);

            document.getElementById("setup-names-screen").classList.add("hidden");
            document.getElementById("setup-word-screen").classList.remove("hidden");
            document.getElementById("exit-btn").classList.remove("hidden");
        }

        function startGame() {
            const input = document.getElementById("secret-word-input").value.toLowerCase().trim();
            if (!input.match(/^[a-z]+$/)) {
                alert("Please enter a valid word using only letters (a-z).");
                return;
            }
            secretWord = input;
            document.getElementById("setup-word-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            document.getElementById("tries-left").innerText = maxTries;
            document.getElementById("wrong-letters").innerText = "None";
            buildWordBoard();
        }

        function buildWordBoard() {
            const container = document.getElementById("word-container");
            container.innerHTML = "";

            for (let char of secretWord) {
                const box = document.createElement("div");
                box.classList.add("letter-box");
                box.innerText = char; 
                
                if (guessedLetters.includes(char)) {
                    box.classList.add("revealed");
                }
                container.appendChild(box);
            }

            const allRevealed = secretWord.split('').every(char => guessedLetters.includes(char));
            if (allRevealed && secretWord.length > 0) {
                endGame(true);
            } else if (wrongGuesses.length >= maxTries) {
                endGame(false);
            }
        }

        function makeGuess() {
            const inputField = document.getElementById("letter-input");
            const letter = inputField.value.toLowerCase().trim();
            inputField.value = "";

            if (!letter.match(/^[a-z]$/)) {
                alert("Please enter a single valid letter.");
                return;
            }

            if (guessedLetters.includes(letter) || wrongGuesses.includes(letter)) {
                alert("You already guessed that letter!");
                return;
            }

            if (secretWord.includes(letter)) {
                guessedLetters.push(letter);
            } else {
                wrongGuesses.push(letter);
                document.getElementById("tries-left").innerText = maxTries - wrongGuesses.length;
                document.getElementById("wrong-letters").innerText = wrongGuesses.join(", ");
            }

            buildWordBoard();

            if (wrongGuesses.length === maxTries - 1) {
                document.getElementById("hint-section").classList.remove("hidden");
            }
        }

        function requestHint() {
            let hint = prompt(`${p1Name}: Enter a helpful hint for ${p2Name}:`);
            if (hint) {
                const hintBox = document.getElementById("hint-display");
                hintBox.innerText = "Hint: " + hint;
                hintBox.classList.remove("hidden");
            }
        }

        function endGame(won) {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("game-over-screen").classList.remove("hidden");
            document.getElementById("exit-btn").classList.add("hidden");
            
            const resultText = won ? `🎉 ${p2Name} Won! All letters scratched out!` : `💀 ${p2Name} Lost! ${p1Name} wins.`;
            document.getElementById("game-result").innerText = resultText;
            document.getElementById("word-reveal").innerText = `The secret word was: "${secretWord.toUpperCase()}"`;
        }
    </script>
</body>
</html>
