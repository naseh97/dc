<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Scratch Word Game</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .exit-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .exit-btn:hover { background: #dc2626; }

        h1 { margin-top: 15px; margin-bottom: 5px; color: #818cf8; }
        p { color: var(--muted); }

        input, select {
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            width: 80%;
            margin-bottom: 15px;
        }

        button.main-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.main-btn:hover { background-color: #4338ca; }

        .word-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .letter-box {
            font-size: 36px;
            font-weight: bold;
            width: 50px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #334155;
            border-radius: 8px;
            color: transparent; 
            transition: all 0.3s ease;
        }

        .letter-box.revealed {
            color: #f8fafc;
            background: #0f172a;
            border: 2px solid #475569;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .hidden { display: none; }
        
        .hint-box {
            margin-top: 15px;
            padding: 10px;
            background: #334155;
            border-radius: 6px;
            color: #facc15;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <button id="exit-btn" class="exit-btn hidden" onclick="resetToHome()">🚪 Exit</button>

        <h1>Scratch Word Game</h1>
        <p>Live word-guessing challenge</p>

        <!-- Phase 1: Setup Game & Players -->
        <div id="setup-names-screen">
            <h3>Game Setup</h3>
            
            <label style="color: var(--muted); display: block; margin-bottom: 5px; text-align: left; margin-left: 38px;">Total Players (Min 2):</label>
            <input type="number" id="num-players" min="2" value="2" onchange="generatePlayerInputs()"><br>
            
            <div id="dynamic-player-inputs">
                <input type="text" id="p-writer" placeholder="Player 1 Name (Word Maker - Writer)" dir="auto"><br>
                <input type="text" id="p-guesser-0" placeholder="Player 2 Name (Guesser)" dir="auto"><br>
            </div>

            <label style="color: var(--muted); display: block; margin-bottom: 5px; text-align: left; margin-left: 38px;">Total Tries for Guessers:</label>
            <select id="max-tries-select">
                <option value="5">5 Tries</option>
                <option value="7" selected>7 Tries</option>
                <option value="10">10 Tries</option>
            </select><br><br>

            <button class="main-btn" onclick="goToWordScreen()">Next: Enter Word</button>
        </div>

        <!-- Phase 2: Writer Enters Word (Visible text input now) -->
        <div id="setup-word-screen" class="hidden">
            <h3 id="p1-prompt">Writer: Enter Secret Word</h3>
            <input type="text" id="secret-word-input" placeholder="e.g. hungry / خواردن / مأكولات" dir="auto">
            <br>
            <button class="main-btn" onclick="startGame()">Start Game</button>
        </div>

        <!-- Phase 3: Guessers' Turn -->
        <div id="game-screen" class="hidden">
            <h3 id="current-guesser-turn">Guesser's Turn</h3>
            
            <div class="stats">
                <div>❤️ Tries Left: <span id="tries-left" style="color: #ef4444; font-weight: bold;">7</span></div>
                <div>❌ Wrong: <span id="wrong-letters">None</span></div>
            </div>

            <div class="word-container" id="word-container" dir="auto"></div>

            <div id="guess-section">
                <input type="text" id="letter-input" maxlength="2" placeholder="Type a letter" dir="auto">
                <br>
                <button class="main-btn" onclick="makeGuess()">Submit Guess</button>
            </div>

            <div id="hint-section" class="hidden">
                <p style="color: #f8fafc; margin-top: 15px;">⚠️ Last try remaining!</p>
                <button class="main-btn" onclick="requestHint()" style="background: #eab308; color: black;">Ask Writer for Hint</button>
                <div id="hint-display" class="hint-box hidden"></div>
            </div>
        </div>

        <!-- Phase 4: Game Over -->
        <div id="game-over-screen" class="hidden">
            <h2 id="game-result" style="font-size: 24px; margin-bottom: 10px;"></h2>
            <p id="word-reveal" style="font-size: 20px; color: #38bdf8; margin-bottom: 20px;" dir="auto"></p>
            <button class="main-btn" onclick="resetToHome()">Play Again</button>
        </div>
    </div>

    <script>
        let writerName = "Player 1";
        let guesserNames = [];
        let currentGuesserIndex = 0;
        let secretWord = "";
        let guessedLetters = [];
        let wrongGuesses = [];
        let maxTries = 7;

        function generatePlayerInputs() {
            let total = parseInt(document.getElementById("num-players").value);
            if (isNaN(total) || total < 2) total = 2;

            let container = document.getElementById("dynamic-player-inputs");
            container.innerHTML = `<input type="text" id="p-writer" placeholder="Player 1 Name (Word Maker - Writer)" dir="auto"><br>`;

            for (let i = 0; i < total - 1; i++) {
                container.innerHTML += `<input type="text" id="p-guesser-${i}" placeholder="Guesser ${i + 1} Name" dir="auto"><br>`;
            }
        }

        function resetToHome() {
            secretWord = "";
            guessedLetters = [];
            wrongGuesses = [];
            currentGuesserIndex = 0;
            
            document.getElementById("secret-word-input").value = "";
            document.getElementById("letter-input").value = "";
            document.getElementById("hint-display").classList.add("hidden");
            document.getElementById("hint-section").classList.add("hidden");

            document.getElementById("setup-names-screen").classList.remove("hidden");
            document.getElementById("setup-word-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("game-over-screen").classList.add("hidden");
            document.getElementById("exit-btn").classList.add("hidden");
        }

        function goToWordScreen() {
            let total = parseInt(document.getElementById("num-players").value);
            if (isNaN(total) || total < 2) {
                alert("Please select at least 2 players.");
                return;
            }

            const wInput = document.getElementById("p-writer").value.trim();
            if (wInput) writerName = wInput;

            guesserNames = [];
            for (let i = 0; i < total - 1; i++) {
                let gInput = document.getElementById(`p-guesser-${i}`).value.trim();
                guesserNames.push(gInput || `Guesser ${i + 1}`);
            }

            maxTries = parseInt(document.getElementById("max-tries-select").value);

            document.getElementById("p1-prompt").innerText = `${writerName} (Writer): Enter Secret Word`;

            document.getElementById("setup-names-screen").classList.add("hidden");
            document.getElementById("setup-word-screen").classList.remove("hidden");
            document.getElementById("exit-btn").classList.remove("hidden");
        }

        function startGame() {
            const input = document.getElementById("secret-word-input").value.trim();
            const validPattern = /^[\u0600-\u06FFa-zA-Z\s]+$/;
            
            if (!input || !validPattern.test(input)) {
                alert("Please enter a valid word using English, Arabic, or Kurdish characters.");
                return;
            }
            secretWord = input;
            currentGuesserIndex = 0;
            document.getElementById("setup-word-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            document.getElementById("tries-left").innerText = maxTries;
            document.getElementById("wrong-letters").innerText = "None";
            updateTurnText();
            buildWordBoard();
        }

        function updateTurnText() {
            let currentGuesser = guesserNames[currentGuesserIndex];
            document.getElementById("current-guesser-turn").innerText = `${currentGuesser}'s Turn to Guess`;
        }

        function buildWordBoard() {
            const container = document.getElementById("word-container");
            container.innerHTML = "";

            for (let char of secretWord) {
                const box = document.createElement("div");
                box.classList.add("letter-box");
                box.innerText = char; 
                
                if (guessedLetters.includes(char) || char === ' ') {
                    box.classList.add("revealed");
                }
                container.appendChild(box);
            }

            const allRevealed = secretWord.split('').every(char => guessedLetters.includes(char) || char === ' ');
            if (allRevealed && secretWord.length > 0) {
                endGame(true);
            } else if (wrongGuesses.length >= maxTries) {
                endGame(false);
            }
        }

        function makeGuess() {
            const inputField = document.getElementById("letter-input");
            const letter = inputField.value.trim();
            inputField.value = "";

            const validLetterPattern = /^[\u0600-\u06FFa-zA-Z]$/;
            if (!letter || !validLetterPattern.test(letter)) {
                alert("Please enter a single valid letter.");
                return;
            }

            if (guessedLetters.includes(letter) || wrongGuesses.includes(letter)) {
                alert("You already guessed that letter!");
                return;
            }

            if (secretWord.includes(letter)) {
                guessedLetters.push(letter);
            } else {
                wrongGuesses.push(letter);
                document.getElementById("tries-left").innerText = maxTries - wrongGuesses.length;
                document.getElementById("wrong-letters").innerText = wrongGuesses.join(", ");
            }

            buildWordBoard();

            if (guesserNames.length > 1 && wrongGuesses.length < maxTries) {
                currentGuesserIndex = (currentGuesserIndex + 1) % guesserNames.length;
                updateTurnText();
            }

            if (wrongGuesses.length === maxTries - 1) {
                document.getElementById("hint-section").classList.remove("hidden");
            }
        }

        function requestHint() {
            let hint = prompt(`${writerName} (Writer): Enter a helpful hint for the guessers:`);
            if (hint) {
                const hintBox = document.getElementById("hint-display");
                hintBox.innerText = "Hint: " + hint;
                hintBox.classList.remove("hidden");
            }
        }

        function endGame(won) {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("game-over-screen").classList.remove("hidden");
            document.getElementById("exit-btn").classList.add("hidden");
            
            const resultText = won ? `🎉 Guessers Won! All letters scratched out!` : `💀 Guessers Lost! ${writerName} (Writer) wins.`;
            document.getElementById("game-result").innerText = resultText;
            document.getElementById("word-reveal").innerText = `The secret word was: "${secretWord}"`;
        }
    </script>
</body>
</html>
