<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player Scratch Word Game</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            text-align: center;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 { margin-bottom: 5px; color: #818cf8; }
        p { color: var(--muted); }

        input {
            padding: 12px 16px;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            width: 70%;
            margin-bottom: 15px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #4338ca; }

        /* The scratch-out word display style */
        .word-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .letter-box {
            font-size: 36px;
            font-weight: bold;
            width: 50px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #334155;
            border-radius: 8px;
            position: relative;
            color: transparent; /* Hidden by default */
            transition: all 0.3s ease;
        }

        /* When letter is guessed, it reveals AND gets scratched out horizontally */
        .letter-box.revealed {
            color: #f8fafc;
            text-decoration: line-through;
            text-decoration-color: #ef4444; /* Red scratch line */
            text-decoration-thickness: 4px;
            background: #0f172a;
            border: 2px dashed #475569;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .hidden { display: none; }
        
        .hint-box {
            margin-top: 15px;
            padding: 10px;
            background: #334155;
            border-radius: 6px;
            color: #facc15;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Scratch Word Game</h1>
        <p>Guess the letters before your tries run out!</p>

        <!-- Phase 1: Player 1 Enters Word -->
        <div id="setup-screen">
            <h3>Player 1: Enter Secret Word</h3>
            <input type="password" id="secret-word-input" placeholder="e.g. hungry">
            <br>
            <button onclick="startGame()">Start Game</button>
        </div>

        <!-- Phase 2: Player 2 Guesses -->
        <div id="game-screen" class="hidden">
            <h3>Player 2: Guess a Letter</h3>
            
            <div class="stats">
                <div>❤️ Tries Left: <span id="tries-left" style="color: #ef4444; font-weight: bold;">7</span></div>
                <div>❌ Wrong: <span id="wrong-letters">None</span></div>
            </div>

            <!-- The word display where letters get revealed and scratched out -->
            <div class="word-container" id="word-container"></div>

            <div id="guess-section">
                <input type="text" id="letter-input" maxlength="1" placeholder="Type a letter">
                <br>
                <button onclick="makeGuess()">Submit Guess</button>
            </div>

            <div id="hint-section" class="hidden">
                <p style="color: #f8fafc; margin-top: 15px;">⚠️ Last try remaining!</p>
                <button onclick="requestHint()" style="background: #eab308; color: black;">Ask Player 1 for Hint</button>
                <div id="hint-display" class="hint-box hidden"></div>
            </div>
        </div>

        <!-- Phase 3: Game Over -->
        <div id="game-over-screen" class="hidden">
            <h2 id="game-result" style="font-size: 28px; margin-bottom: 20px;"></h2>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        let secretWord = "";
        let guessedLetters = [];
        let wrongGuesses = [];
        const maxTries = 7;

        function startGame() {
            const input = document.getElementById("secret-word-input").value.toLowerCase().trim();
            if (!input.match(/^[a-z]+$/)) {
                alert("Please enter a valid word using only letters (a-z).");
                return;
            }
            secretWord = input;
            document.getElementById("setup-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            buildWordBoard();
        }

        function buildWordBoard() {
            const container = document.getElementById("word-container");
            container.innerHTML = "";

            for (let char of secretWord) {
                const box = document.createElement("div");
                box.classList.add("letter-box");
                box.innerText = char; // Stores the letter inside invisibly
                
                if (guessedLetters.includes(char)) {
                    box.classList.add("revealed");
                }
                container.appendChild(box);
            }

            // Check win condition
            const allRevealed = secretWord.split('').every(char => guessedLetters.includes(char));
            if (allRevealed && secretWord.length > 0) {
                endGame(true);
            } else if (wrongGuesses.length >= maxTries) {
                endGame(false);
            }
        }

        function makeGuess() {
            const inputField = document.getElementById("letter-input");
            const letter = inputField.value.toLowerCase().trim();
            inputField.value = "";

            if (!letter.match(/^[a-z]$/)) {
                alert("Please enter a single valid letter.");
                return;
            }

            if (guessedLetters.includes(letter) || wrongGuesses.includes(letter)) {
                alert("You already guessed that letter!");
                return;
            }

            if (secretWord.includes(letter)) {
                guessedLetters.push(letter);
            } else {
                wrongGuesses.push(letter);
                document.getElementById("tries-left").innerText = maxTries - wrongGuesses.length;
                document.getElementById("wrong-letters").innerText = wrongGuesses.join(", ");
            }

            buildWordBoard();

            // Trigger hint area on the last try
            if (wrongGuesses.length === maxTries - 1) {
                document.getElementById("hint-section").classList.remove("hidden");
            }
        }

        function requestHint() {
            let hint = prompt("Player 1: Enter a helpful hint for Player 2:");
            if (hint) {
                const hintBox = document.getElementById("hint-display");
                hintBox.innerText = "Hint: " + hint;
                hintBox.classList.remove("hidden");
            }
        }

        function endGame(won) {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("game-over-screen").classList.remove("hidden");
            const resultText = won ? "🎉 Player 2 Won! All letters scratched out!" : "💀 Player 2 Lost! Player 1's word stays hidden.";
            document.getElementById("game-result").innerText = resultText;
        }
    </script>
</body>
</html>
